<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form class="radio-group">
        <!-- label нужен, чтобы по тексту тоже можно было кликать -->
        <label class="radio">
            <!-- сама радиокнопка (настоящая, но мы её спрячем) -->
            <input type="radio" name="idOneOrTwo" value="One" checked>
            <!-- кастомный кружок, который мы будем стилизовать -->
            <span class="custom-radio"></span>
            <!-- текст варианта -->
            user_id:1
        </label>

        <label class="radio">
            <input type="radio" name="idOneOrTwo" value="Two">
            <span class="custom-radio"></span>
            user_id:2
        </label>
    </form>
    <div id="chatic" class="box">
        <div class="chat">
            <div class="messages"></div>
        </div>
    </div>
    <div class="send">
        <input placeholder="Сообщение..." type="text" name="user-login" id="login">
        <button onclick="showText()" class="showtext">Отправить</button>
    </div>
    <script src="env.js"></script>
    <script src="script.js"></script>
</body>

</html>
